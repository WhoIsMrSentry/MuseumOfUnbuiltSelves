name: Build and deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Create .env from secrets
        run: |
          echo "VITE_SPOTIFY_CLIENT_ID=${{ secrets.VITE_SPOTIFY_CLIENT_ID }}" >> .env
          echo "SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}" >> .env
          echo "SPOTIFY_USER_ID=${{ secrets.SPOTIFY_USER_ID }}" >> .env

      - name: Fetch Spotify data (build-time)
        run: |
          echo "Running fetch-data (will generate public/playlists.json)"
          # If repository secrets are not configured in Actions, fall back to the
          # local `playlists.json` by exporting SKIP_FETCH=true so the script
          # copies `playlists.json` into `public/` instead of trying to call
          # the Spotify API and failing the job.
          SKIP_FETCH=true npm run fetch-data

      - name: Build
        run: |
          # Ensure fetch-data does not attempt live Spotify API during build
          # and overwrite the copied local playlists.json. Propagate SKIP_FETCH
          # so the `npm run build`'s internal `fetch-data` honors the fallback.
          SKIP_FETCH=true npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
